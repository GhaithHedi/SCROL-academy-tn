{% extends "base.html" %}
{% block title %}{{ t('fp.title') }}{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="container auth-grid">
    <div class="auth-side reveal">
      <h1>{{ t('fp.heading') }}</h1>
      <ul class="auth-perks">
        <li>{{ t('log.perk1') }}</li>
        <li>{{ t('log.perk2') }}</li>
        <li>{{ t('log.perk3') }}</li>
      </ul>
    </div>

    <form class="card auth-card reveal delay-1" method="post" action="{{ url_for('forgot_password') }}">
      <h2>{{ t('fp.title') }}</h2>
      <p class="muted">{{ t('fp.intro') }}</p>

      <label class="field">
        <span>{{ t('fp.email_label') }}</span>
        <input type="email" name="email" required dir="ltr" placeholder="name@example.com">
      </label>

      <button class="btn btn-primary btn-block btn-lg" type="submit">{{ t('fp.submit') }}</button>
      <p class="auth-alt"><a href="{{ url_for('login') }}">{{ t('fp.back_to_login') }}</a></p>
    </form>
  </div>
</section>
{% endblock %}
